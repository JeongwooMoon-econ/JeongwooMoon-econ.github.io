<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeongwoo Moon — Note</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <nav class="top-nav">
    <a href="index.html" class="nav-name">Jeongwoo Moon</a>
    <div class="nav-links">
      <a href="https://jeongwoomoon-econ.github.io/CV_JeongwooMoon.pdf" target="_blank"
        rel="noopener noreferrer">CV</a>
      <a href="teaching.html">Teaching</a>
    </div>
  </nav>

  <div class="container">
    <div id="password-box">
      <h2>Protected Page</h2>
      <p>Please enter the password to view this page.</p>
      <input type="password" id="note-password-input" />
      <button id="note-password-button">Enter</button>
      <p id="password-error" style="color: red; display: none;">Incorrect password. Please try again.</p>
    </div>

    <section id="note-content" style="display: none;">
      <h2>Note</h2>
      <p>
        This is your private note page content.
      </p>
    </section>
  </div>
  <script src="script.js"></script>
  <script>
    (function () {
      const PASSWORD = "moon2026"; // change this to whatever you like
      const input = document.getElementById("note-password-input");
      const button = document.getElementById("note-password-button");
      const error = document.getElementById("password-error");
      const box = document.getElementById("password-box");
      const content = document.getElementById("note-content");

      function checkPassword() {
        if (input.value === PASSWORD) {
          box.style.display = "none";
          content.style.display = "block";
          error.style.display = "none";
        } else {
          error.style.display = "block";
        }
      }

      button.addEventListener("click", checkPassword);
      input.addEventListener("keyup", function (e) {
        if (e.key === "Enter") {
          checkPassword();
        }
      });
    })();
  </script>
</body>

</html>
